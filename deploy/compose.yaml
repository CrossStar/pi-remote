services:
  ntfy:
    image: binwiederhier/ntfy:v2.28.0
    command: serve
    restart: unless-stopped
    volumes:
      - ./server.yml:/etc/ntfy/server.yml:ro
      - ntfy-data:/var/lib/ntfy
    ports:
      - "127.0.0.1:8080:80"
  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:?Set tunnel token}
volumes:
  ntfy-data:
